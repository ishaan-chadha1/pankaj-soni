<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none">
<defs>
  
<filter id="lg" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" seed="14" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.36"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
</filter>
  <filter id="lb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a2c12"/>
    <stop offset=".2" stop-color="#c9a961"/>
    <stop offset=".44" stop-color="#f7ecd0"/>
    <stop offset=".7" stop-color="#c9a961"/>
    <stop offset="1" stop-color="#3a2c12"/>
  </linearGradient>
  <linearGradient id="blt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5e3129"/>
    <stop offset=".3" stop-color="#b4756a"/>
    <stop offset=".55" stop-color="#fff" stop-opacity=".45"/>
    <stop offset=".8" stop-color="#b4756a"/>
    <stop offset="1" stop-color="#5e3129"/>
  </linearGradient>
  <radialGradient id="lamb" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#b4756a" stop-opacity=".22"/>
    <stop offset="1" stop-color="#b4756a" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="900" height="1200" fill="url(#lamb)"/>
<ellipse cx="450" cy="1050" rx="190" ry="30" fill="#000" opacity=".42" filter="url(#lb)"/>

<g filter="url(#lg)">
  <!-- angled bullet -->
  <path d="M358 470 h184 v-118 l-184 -96 z" fill="url(#blt)"/>
  <path d="M358 352 l184 96" stroke="#fff" stroke-width="3" opacity=".35"/>

  <!-- case -->
  <rect x="346" y="470" width="208" height="470" rx="5" fill="url(#case)"/>
  <rect x="346" y="470" width="208" height="26" fill="#000" opacity=".26"/>
  <rect x="346" y="690" width="208" height="16" fill="#000" opacity=".30"/>
  <rect x="346" y="706" width="208" height="4" fill="#fff" opacity=".26"/>
  <rect x="380" y="512" width="14" height="392" fill="#fff" opacity=".30" filter="url(#lb)"/>
</g>
</svg>