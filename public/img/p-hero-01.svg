<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125" fill="none">
<defs>
  
<filter id="pg1" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="39" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.4"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="pb1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="110"/></filter>
  <linearGradient id="bg1" x1="0" y1="0" x2=".55" y2="1">
    <stop offset="0" stop-color="#fdfaf4"/>
    <stop offset="1" stop-color="#e8dcc6"/>
  </linearGradient>
  <radialGradient id="key1" cx=".6" cy=".28" r=".72">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".24"/>
    <stop offset="1" stop-color="#c9a961" stop-opacity=".1"/>
  </radialGradient>
  <!-- a whisper of edge shading, so the plate has a body rather than reading flat -->
  <radialGradient id="vig1" cx=".5" cy=".48" r=".76">
    <stop offset=".5" stop-color="#8a7f6b" stop-opacity="0"/>
    <stop offset="1" stop-color="#8a7f6b" stop-opacity=".2"/>
  </radialGradient>
</defs>

<g filter="url(#pg1)">
  <rect width="2000" height="1125" fill="url(#bg1)"/>
  <g filter="url(#pb1)">
    <g>
      <path d="M200 -112.5 L 920 -112.5 L 400 1237.5 L -120 1237.5 Z" fill="#ffffff" opacity=".55"/>
      <path d="M1040 -112.5 L 1400 -112.5 L 1000 1237.5 L 680 1237.5 Z" fill="#c9a961" opacity=".16"/>
      <path d="M1640 -112.5 L 2040 -112.5 L 1720 1237.5 L 1360 1237.5 Z" fill="#ffffff" opacity=".38"/>
    </g></g>
  <rect width="2000" height="1125" fill="url(#key1)"/>
</g>
<rect width="2000" height="1125" fill="url(#vig1)"/>
</svg>