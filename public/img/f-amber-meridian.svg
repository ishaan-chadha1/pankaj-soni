<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none">
<defs>
  
  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdfbf7"/>
    <stop offset="1" stop-color="#f2ece1"/>
  </linearGradient>
  <radialGradient id="key" cx=".5" cy=".38" r=".6">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".6" stop-color="#e0a548" stop-opacity=".10"/>
    <stop offset="1" stop-color="#e0a548" stop-opacity="0"/>
  </radialGradient>
  
<filter id="fg" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="4" seed="26" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.26"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="bA" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="bB" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="bS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>

  <!-- Glass on a light ground reads by its EDGES: bright rims, a translucent
       core, and a deeper shoulder where the wall thickens. -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#9a6a1e" stop-opacity=".72"/>
    <stop offset=".07"  stop-color="#ffffff" stop-opacity=".82"/>
    <stop offset=".22"  stop-color="#e0a548" stop-opacity=".78"/>
    <stop offset=".5"   stop-color="#e0a548" stop-opacity=".92"/>
    <stop offset=".78"  stop-color="#e0a548" stop-opacity=".76"/>
    <stop offset=".93"  stop-color="#ffffff" stop-opacity=".78"/>
    <stop offset="1"    stop-color="#9a6a1e" stop-opacity=".70"/>
  </linearGradient>

  <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff" stop-opacity=".55"/>
    <stop offset=".28" stop-color="#ffffff" stop-opacity=".06"/>
    <stop offset=".84" stop-color="#9a6a1e" stop-opacity=".22"/>
    <stop offset="1"   stop-color="#9a6a1e" stop-opacity=".40"/>
  </linearGradient>

  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#9a7c3e"/>
    <stop offset=".22" stop-color="#e0c383"/>
    <stop offset=".44" stop-color="#fdf6e4"/>
    <stop offset=".68" stop-color="#c9a961"/>
    <stop offset="1"   stop-color="#8a6d33"/>
  </linearGradient>

  <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6d6250" stop-opacity=".38"/>
    <stop offset="1" stop-color="#6d6250" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="900" height="1200" fill="url(#pg)"/>
<rect width="900" height="1200" fill="url(#key)"/>

<!-- soft contact shadow, thrown slightly right as if lit from upper left -->
<ellipse cx="466" cy="1062" rx="312" ry="30" fill="url(#shadow)" filter="url(#bS)"/>

<g filter="url(#fg)">
  <rect x="393" y="322" width="114" height="82" fill="url(#glass)" opacity=".82"/>

  <rect x="190" y="380" width="520" height="670" rx="190" fill="url(#glass)"/>
  <rect x="190" y="380" width="520" height="670" rx="190" fill="url(#depth)"/>

  <!-- fill line -->
  <rect x="198" y="507.3" width="504" height="2.5"
        fill="#ffffff" opacity=".55"/>

  <!-- broad soft highlight down the left wall -->
  <rect x="234.2" y="410" width="44.2" height="578" rx="21.84" fill="#fff" opacity=".62" filter="url(#bB)"/>
  <!-- crisp hot rim on the right -->
  <rect x="658" y="426" width="10.4" height="546" rx="4" fill="#fff" opacity=".85"/>

  <!-- engraved plaque (blank; the name is set in HTML) -->
  <rect x="294" y="728.4000000000001" width="312" height="134" rx="2" fill="#ffffff" opacity=".2"/>
  <rect x="294" y="728.4000000000001" width="312" height="1"
        fill="#ffffff" opacity=".7"/>

  <rect x="385.4" y="306" width="129.20000000000002" height="22" rx="3" fill="url(#metal)"/>

  <rect x="355" y="188" width="190" height="118" rx="14" fill="url(#metal)"/>
  <rect x="355" y="188" width="190" height="17.7" fill="#fff" opacity=".45"/>
  <rect x="355" y="297" width="190" height="9" fill="#7a6a4a" opacity=".22"/>
</g>

<ellipse cx="450" cy="410" rx="239.20000000000002" ry="52" fill="#fff" opacity=".38" filter="url(#bA)"/>
</svg>