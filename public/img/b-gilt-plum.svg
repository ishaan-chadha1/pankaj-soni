<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none">
<defs>
  
  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdf9f8"/>
    <stop offset="1" stop-color="#f4e6e4"/>
  </linearGradient>
  <radialGradient id="key" cx=".5" cy=".38" r=".6">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".6" stop-color="#963a60" stop-opacity=".10"/>
    <stop offset="1" stop-color="#963a60" stop-opacity="0"/>
  </radialGradient>
  
<filter id="lg" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="4" seed="26" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.24"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="lb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="ls" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
  <linearGradient id="case" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#8a6d33"/>
    <stop offset=".2" stop-color="#c9a961"/>
    <stop offset=".44" stop-color="#fdf6e4"/>
    <stop offset=".7" stop-color="#c9a961"/>
    <stop offset="1" stop-color="#8a6d33"/>
  </linearGradient>
  <linearGradient id="blt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#521a30"/>
    <stop offset=".3" stop-color="#963a60"/>
    <stop offset=".55" stop-color="#fff" stop-opacity=".55"/>
    <stop offset=".8" stop-color="#963a60"/>
    <stop offset="1" stop-color="#521a30"/>
  </linearGradient>
</defs>

<rect width="900" height="1200" fill="url(#pg)"/>
<rect width="900" height="1200" fill="url(#key)"/>
<ellipse cx="464" cy="1046" rx="176" ry="24" fill="#6d6250" opacity=".3" filter="url(#ls)"/>

<g filter="url(#lg)">
  <path d="M358 470 h184 v-118 l-184 -96 z" fill="url(#blt)"/>
  <path d="M358 352 l184 96" stroke="#fff" stroke-width="3" opacity=".5"/>

  <rect x="346" y="470" width="208" height="470" rx="5" fill="url(#case)"/>
  <rect x="346" y="470" width="208" height="24" fill="#7a6a4a" opacity=".2"/>
  <rect x="346" y="690" width="208" height="15" fill="#7a6a4a" opacity=".24"/>
  <rect x="346" y="705" width="208" height="4" fill="#fff" opacity=".55"/>
  <rect x="378" y="512" width="15" height="392" fill="#fff" opacity=".55" filter="url(#lb)"/>
</g>
</svg>