<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125" fill="none">
<defs>
  
<filter id="pg3" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="39" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.4"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="pb3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="110"/></filter>
  <linearGradient id="bg3" x1="0" y1="0" x2=".55" y2="1">
    <stop offset="0" stop-color="#fdf8f7"/>
    <stop offset="1" stop-color="#f0dcd9"/>
  </linearGradient>
  <radialGradient id="key3" cx=".6" cy=".28" r=".72">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".24"/>
    <stop offset="1" stop-color="#c58592" stop-opacity=".1"/>
  </radialGradient>
  <!-- a whisper of edge shading, so the plate has a body rather than reading flat -->
  <radialGradient id="vig3" cx=".5" cy=".48" r=".76">
    <stop offset=".5" stop-color="#8a7f6b" stop-opacity="0"/>
    <stop offset="1" stop-color="#8a7f6b" stop-opacity=".2"/>
  </radialGradient>
</defs>

<g filter="url(#pg3)">
  <rect width="2000" height="1125" fill="url(#bg3)"/>
  <g filter="url(#pb3)">
    <path d="M-200 1068.75 C 360 585, 600 990, 1040 517.5 S 1720 225, 2200 652.5 L 2200 1237.5 L -200 1237.5 Z" fill="#f0dcd9" opacity=".55"/>
    <path d="M-200 1147.5 C 480 787.5, 880 1125, 1320 742.5 S 1880 517.5, 2200 877.5 L 2200 1260.0000000000002 L -200 1260.0000000000002 Z" fill="#ffffff" opacity=".45"/></g>
  <rect width="2000" height="1125" fill="url(#key3)"/>
</g>
<rect width="2000" height="1125" fill="url(#vig3)"/>
</svg>