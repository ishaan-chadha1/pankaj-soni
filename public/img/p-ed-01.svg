<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600" fill="none">
<defs>
  
<filter id="pg4" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="39" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.4"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="pb4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="66"/></filter>
  <linearGradient id="bg4" x1="0" y1="0" x2=".55" y2="1">
    <stop offset="0" stop-color="#fdfaf4"/>
    <stop offset="1" stop-color="#ece0ca"/>
  </linearGradient>
  <radialGradient id="key4" cx=".6" cy=".28" r=".72">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".24"/>
    <stop offset="1" stop-color="#c9a961" stop-opacity=".1"/>
  </radialGradient>
  <!-- a whisper of edge shading, so the plate has a body rather than reading flat -->
  <radialGradient id="vig4" cx=".5" cy=".48" r=".76">
    <stop offset=".5" stop-color="#8a7f6b" stop-opacity="0"/>
    <stop offset="1" stop-color="#8a7f6b" stop-opacity=".2"/>
  </radialGradient>
</defs>

<g filter="url(#pg4)">
  <rect width="1200" height="1600" fill="url(#bg4)"/>
  <g filter="url(#pb4)">
    <path d="M-120 1520 C 216 832, 360 1408, 624 736 S 1032 320, 1320 927.9999999999999 L 1320 1760.0000000000002 L -120 1760.0000000000002 Z" fill="#ece0ca" opacity=".55"/>
    <path d="M-120 1632 C 288 1120, 528 1600, 792 1056 S 1128 736, 1320 1248 L 1320 1792.0000000000002 L -120 1792.0000000000002 Z" fill="#ffffff" opacity=".45"/></g>
  <rect width="1200" height="1600" fill="url(#key4)"/>
</g>
<rect width="1200" height="1600" fill="url(#vig4)"/>
</svg>