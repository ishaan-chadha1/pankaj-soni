<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" fill="none">
<defs>
  
  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fdfbf7"/>
    <stop offset="1" stop-color="#f2ece1"/>
  </linearGradient>
  <radialGradient id="key" cx=".5" cy=".38" r=".6">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".6" stop-color="#a07c46" stop-opacity=".10"/>
    <stop offset="1" stop-color="#a07c46" stop-opacity="0"/>
  </radialGradient>
  
<filter id="eg" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="1.1" numOctaves="4" seed="26" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.22"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="eb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="es" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="16"/></filter>
  <linearGradient id="lens" x1="0" y1="0" x2=".7" y2="1">
    <stop offset="0"   stop-color="#ffffff" stop-opacity=".72"/>
    <stop offset=".3"  stop-color="#a07c46" stop-opacity=".72"/>
    <stop offset=".8"  stop-color="#5e4522" stop-opacity=".82"/>
    <stop offset="1"   stop-color="#5e4522" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="fr" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#a4884e" stop-opacity=".82"/>
    <stop offset=".5" stop-color="#a4884e"/>
    <stop offset="1" stop-color="#a4884e" stop-opacity=".9"/>
  </linearGradient>
</defs>

<rect width="900" height="620" fill="url(#pg)"/>
<rect width="900" height="620" fill="url(#key)"/>
<ellipse cx="458" cy="472" rx="250" ry="20" fill="#6d6250" opacity=".22" filter="url(#es)"/>

<g filter="url(#eg)">
  <path d="M112 254 q-90 6 -128 58" stroke="url(#fr)" stroke-width="13" stroke-linecap="round"/>
  <path d="M788 254 q90 6 128 58" stroke="url(#fr)" stroke-width="13" stroke-linecap="round"/>
  <path d="M394 248 q68 -30 112 0" stroke="url(#fr)" stroke-width="12" stroke-linecap="round"/>

  <path d="M130 226 h264 a26 26 0 0 1 25 30 l-14 74 a132 132 0 0 1 -258 0 l-14 -74 a26 26 0 0 1 25 -30 z" fill="url(#lens)" stroke="url(#fr)" stroke-width="11"/>
  <path d="M506 226 h264 a26 26 0 0 1 25 30 l-14 74 a132 132 0 0 1 -258 0 l-14 -74 a26 26 0 0 1 25 -30 z" fill="url(#lens)" stroke="url(#fr)" stroke-width="11"/>

  <path d="M166 334 l104 -104" stroke="#fff" stroke-width="18" opacity=".5" stroke-linecap="round" filter="url(#eb)"/>
  <path d="M212 354 l104 -104" stroke="#fff" stroke-width="7"  opacity=".38" stroke-linecap="round" filter="url(#eb)"/>
  <path d="M542 334 l104 -104" stroke="#fff" stroke-width="18" opacity=".5" stroke-linecap="round" filter="url(#eb)"/>
  <path d="M588 354 l104 -104" stroke="#fff" stroke-width="7"  opacity=".38" stroke-linecap="round" filter="url(#eb)"/>
</g>
</svg>