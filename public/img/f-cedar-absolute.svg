<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none">
<defs>
  
  <linearGradient id="pg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fafcfa"/>
    <stop offset="1" stop-color="#e6ede6"/>
  </linearGradient>
  <radialGradient id="key" cx=".5" cy=".38" r=".6">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset=".6" stop-color="#7d9068" stop-opacity=".10"/>
    <stop offset="1" stop-color="#7d9068" stop-opacity="0"/>
  </radialGradient>
  
<filter id="fg" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="1" numOctaves="4" seed="26" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.26"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="bA" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30"/></filter>
  <filter id="bB" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="bS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>

  <!-- Glass on a light ground reads by its EDGES: bright rims, a translucent
       core, and a deeper shoulder where the wall thickens. -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#41533a" stop-opacity=".72"/>
    <stop offset=".07"  stop-color="#ffffff" stop-opacity=".82"/>
    <stop offset=".22"  stop-color="#7d9068" stop-opacity=".78"/>
    <stop offset=".5"   stop-color="#7d9068" stop-opacity=".92"/>
    <stop offset=".78"  stop-color="#7d9068" stop-opacity=".76"/>
    <stop offset=".93"  stop-color="#ffffff" stop-opacity=".78"/>
    <stop offset="1"    stop-color="#41533a" stop-opacity=".70"/>
  </linearGradient>

  <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff" stop-opacity=".55"/>
    <stop offset=".28" stop-color="#ffffff" stop-opacity=".06"/>
    <stop offset=".84" stop-color="#41533a" stop-opacity=".22"/>
    <stop offset="1"   stop-color="#41533a" stop-opacity=".40"/>
  </linearGradient>

  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#8f959c"/>
    <stop offset=".22" stop-color="#d5dae0"/>
    <stop offset=".44" stop-color="#ffffff"/>
    <stop offset=".68" stop-color="#b4bac1"/>
    <stop offset="1"   stop-color="#858b92"/>
  </linearGradient>

  <radialGradient id="shadow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6d6250" stop-opacity=".38"/>
    <stop offset="1" stop-color="#6d6250" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="900" height="1200" fill="url(#pg)"/>
<rect width="900" height="1200" fill="url(#key)"/>

<!-- soft contact shadow, thrown slightly right as if lit from upper left -->
<ellipse cx="466" cy="1062" rx="264" ry="30" fill="url(#shadow)" filter="url(#bS)"/>

<g filter="url(#fg)">
  <rect x="380.4" y="228" width="139.2" height="96" fill="url(#glass)" opacity=".82"/>

  <rect x="230" y="300" width="440" height="750" rx="4" fill="url(#glass)"/>
  <rect x="230" y="300" width="440" height="750" rx="4" fill="url(#depth)"/>

  <!-- fill line -->
  <rect x="238" y="442.5" width="424" height="2.5"
        fill="#ffffff" opacity=".55"/>

  <!-- broad soft highlight down the left wall -->
  <rect x="267.4" y="330" width="37.400000000000006" height="658" rx="18.48" fill="#fff" opacity=".62" filter="url(#bB)"/>
  <!-- crisp hot rim on the right -->
  <rect x="626" y="346" width="8.8" height="626" rx="4" fill="#fff" opacity=".85"/>

  <!-- engraved plaque (blank; the name is set in HTML) -->
  <rect x="318" y="690" width="264" height="150" rx="2" fill="#ffffff" opacity=".2"/>
  <rect x="318" y="690" width="264" height="1"
        fill="#ffffff" opacity=".7"/>

  <rect x="371.12" y="212" width="157.76000000000002" height="22" rx="3" fill="url(#metal)"/>

  <rect x="334" y="92" width="232" height="120" rx="3" fill="url(#metal)"/>
  <rect x="334" y="92" width="232" height="18" fill="#fff" opacity=".45"/>
  <rect x="334" y="203" width="232" height="9" fill="#7a6a4a" opacity=".22"/>
</g>

<ellipse cx="450" cy="330" rx="202.4" ry="52" fill="#fff" opacity=".38" filter="url(#bA)"/>
</svg>