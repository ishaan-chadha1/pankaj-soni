<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" fill="none">
<defs>
  
<filter id="fg" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="14" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.4"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
</filter>
  <filter id="blurA" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
  <filter id="blurB" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>

  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"    stop-color="#ffffff" stop-opacity=".50"/>
    <stop offset=".10"  stop-color="#4a5a3c" stop-opacity=".92"/>
    <stop offset=".42"  stop-color="#1b2416"/>
    <stop offset=".72"  stop-color="#4a5a3c"/>
    <stop offset=".93"  stop-color="#ffffff" stop-opacity=".38"/>
    <stop offset="1"    stop-color="#1b2416" stop-opacity=".8"/>
  </linearGradient>

  <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"   stop-color="#ffffff" stop-opacity=".22"/>
    <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".82" stop-color="#000000" stop-opacity=".30"/>
    <stop offset="1"   stop-color="#000000" stop-opacity=".52"/>
  </linearGradient>

  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#4a4d52"/>
    <stop offset=".22" stop-color="#b9bec6"/>
    <stop offset=".44" stop-color="#f2f4f7"/>
    <stop offset=".68" stop-color="#9aa0a8"/>
    <stop offset="1"   stop-color="#55585d"/>
  </linearGradient>

  <radialGradient id="floor" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#000" stop-opacity=".55"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="amb" cx=".5" cy=".38" r=".62">
    <stop offset="0" stop-color="#4a5a3c" stop-opacity=".26"/>
    <stop offset="1" stop-color="#4a5a3c" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ambient halo so the bottle sits in light rather than on a flat field -->
<rect width="900" height="1200" fill="url(#amb)"/>

<!-- contact shadow -->
<ellipse cx="450" cy="1068" rx="272.8" ry="34" fill="url(#floor)"/>

<g filter="url(#fg)">
  <!-- neck -->
  <rect x="380.4" y="228" width="139.2" height="96" fill="url(#glass)" opacity=".9"/>

  <!-- body -->
  <rect x="230" y="300" width="440" height="750" rx="4" fill="url(#glass)"/>
  <rect x="230" y="300" width="440" height="750" rx="4" fill="url(#depth)"/>

  <!-- liquid meniscus: a brighter band where the fill line sits -->
  <rect x="240" y="450" width="420" height="3"
        fill="#ffffff" opacity=".20"/>

  <!-- left specular column -->
  <rect x="263" y="334" width="33" height="654" rx="16.279999999999998" fill="#fff" opacity=".30" filter="url(#blurB)"/>
  <!-- narrow hot edge on the right -->
  <rect x="623.8" y="352" width="9.68" height="618" rx="4" fill="#fff" opacity=".55" filter="url(#blurB)"/>

  <!-- engraved plaque (kept blank; the name is set in HTML) -->
  <rect x="318" y="690" width="264" height="150" rx="2" fill="#000" opacity=".14"/>
  <rect x="318" y="690" width="264" height="1"
        fill="#fff" opacity=".22"/>

  <!-- collar -->
  <rect x="371.12" y="212" width="157.76000000000002" height="22" rx="3" fill="url(#metal)"/>

  <!-- cap -->
  <rect x="334" y="92" width="232" height="120" rx="3" fill="url(#metal)"/>
  <rect x="334" y="92" width="232" height="19.2" fill="#fff" opacity=".16"/>
  <rect x="334" y="204" width="232" height="8" fill="#000" opacity=".22"/>
</g>

<!-- glow lifted off the shoulders -->
<ellipse cx="450" cy="340" rx="220" ry="60" fill="#fff" opacity=".07" filter="url(#blurA)"/>
</svg>