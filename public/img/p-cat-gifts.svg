<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
<defs>
  
<filter id="pg12" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="28" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.7"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="overlay"/>
</filter>
  <filter id="pb12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="96"/></filter>
  <linearGradient id="bg12" x1="0" y1="0" x2=".6" y2="1">
    <stop offset="0" stop-color="#0a0808"/>
    <stop offset="1" stop-color="#231a12"/>
  </linearGradient>
  <radialGradient id="key12" cx=".64" cy=".3" r=".7">
    <stop offset="0" stop-color="#d0b378" stop-opacity=".40"/>
    <stop offset=".55" stop-color="#d0b378" stop-opacity=".08"/>
    <stop offset="1" stop-color="#d0b378" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig12" cx=".5" cy=".5" r=".78">
    <stop offset=".45" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity=".62"/>
  </radialGradient>
</defs>

<g filter="url(#pg12)">
  <rect width="1600" height="900" fill="url(#bg12)"/>
  <g filter="url(#pb12)">
    <ellipse cx="992" cy="396" rx="544" ry="378" fill="#d0b378" opacity=".16"/>
    <ellipse cx="480" cy="594" rx="480" ry="270" fill="#231a12" opacity=".5"/></g>
  <rect width="1600" height="900" fill="url(#key12)"/>
</g>
<rect width="1600" height="900" fill="url(#vig12)"/>
</svg>