<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" fill="none">
<defs>
  
<filter id="pg7" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="39" result="n"/>
  <feColorMatrix in="n" type="saturate" values="0" result="d"/>
  <feComponentTransfer in="d" result="g">
    <feFuncA type="linear" slope="0.4"/>
  </feComponentTransfer>
  <feBlend in="SourceGraphic" in2="g" mode="soft-light"/>
</filter>
  <filter id="pb7" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="88"/></filter>
  <linearGradient id="bg7" x1="0" y1="0" x2=".55" y2="1">
    <stop offset="0" stop-color="#fdfaf4"/>
    <stop offset="1" stop-color="#e6ddcc"/>
  </linearGradient>
  <radialGradient id="key7" cx=".6" cy=".28" r=".72">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
    <stop offset=".5" stop-color="#ffffff" stop-opacity=".24"/>
    <stop offset="1" stop-color="#a8926e" stop-opacity=".1"/>
  </radialGradient>
  <!-- a whisper of edge shading, so the plate has a body rather than reading flat -->
  <radialGradient id="vig7" cx=".5" cy=".48" r=".76">
    <stop offset=".5" stop-color="#8a7f6b" stop-opacity="0"/>
    <stop offset="1" stop-color="#8a7f6b" stop-opacity=".2"/>
